name: areview

services:
  # Base de Datos PostgreSQL (con soporte pgvector para RSL/embeddings)
  db:
    image: pgvector/pgvector:pg16
    container_name: areview_db
    restart: always
    env_file:
      - .env
    ports:
      - "${HOST_BINDING:-127.0.0.1}:${DB_PORT:-5411}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-areview_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Broker y Cache Redis
  redis:
    image: redis:7-alpine
    container_name: areview_redis
    restart: always
    ports:
      - "${HOST_BINDING:-127.0.0.1}:${REDIS_PORT_HOST:-${REDIS_HOST_PORT:-6371}}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ejecución de migraciones con Alembic
  migrations:
    build: .
    container_name: areview_migrations
    user: "${UID:-1000}:${GID:-1000}"
    command: alembic upgrade head
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # Servicio Backend (FastAPI)
  areview_back:
    build: .
    container_name: areview_back
    user: "${UID:-1000}:${GID:-1000}"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${HOST_BINDING:-127.0.0.1}:${BACKEND_PORT:-${PORT:-8003}}:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  # Servicio Celery Worker para tareas asíncronas
  celery_worker:
    build: .
    container_name: areview_celery
    user: "${UID:-1000}:${GID:-1000}"
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
